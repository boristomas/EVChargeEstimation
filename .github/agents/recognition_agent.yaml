name: dashboard-recognition-agent
description: |
  Automatically updates recognition logic when users report dashboard recognition issues.
  Downloads attached dashboard images, stores them in app/sampledata/, updates code, and opens a PR.

inputs:
  - name: issue_number
    type: number
  - name: issue_title
    type: string
  - name: issue_body
    type: string
  - name: attachments
    type: array

runs:
  using: docker
  image: ghcr.io/boristomas/evchargeestimation-agent:latest

permissions:
  contents: write
  pull-requests: write
  issues: read
