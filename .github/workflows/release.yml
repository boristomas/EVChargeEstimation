# Build a signed release APK and attach it to a GitHub Release when you push a version tag.
#
# Tag format: v1.0.1  (should match the versionName you ship)
#
# Required repository secrets:
#   KEYSTORE_BASE64      — base64 of keystore/evcharge-release.jks
#   KEYSTORE_PASSWORD    — store password
#   KEY_ALIAS            — key alias (evcharge)
#   KEY_PASSWORD         — key password
#
# Create a release:
#   1. Bump versionCode (+1) and versionName in app/build.gradle.kts
#   2. git commit && git tag v1.0.1 && git push origin main --tags

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name without v (e.g. 1.0.1)"
        required: true
      version_code:
        description: "Integer versionCode (must increase each release)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version_name }}"
            CODE="${{ github.event.inputs.version_code }}"
          else
            RAW="${GITHUB_REF_NAME}"
            NAME="${RAW#v}"
            CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')
            if [ -z "$CODE" ]; then CODE=1; fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$NAME versionCode=$CODE"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret KEYSTORE_BASE64" >&2
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/evcharge-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore/evcharge-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > keystore.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }} \
            --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found $APK"
          ls -lh "$APK"

      - name: Create GitHub Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: EV Charge ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## EV Charge ${{ steps.ver.outputs.name }}

            - **versionName:** ${{ steps.ver.outputs.name }}
            - **versionCode:** ${{ steps.ver.outputs.code }}

            Download the `.apk` below, open it on your phone, and install
            (allow “Install unknown apps” if prompted).

            The app can also check this page for updates automatically.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
